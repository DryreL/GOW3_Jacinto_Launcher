name: build
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # GitHub artifact attestation (free provenance, not an Authenticode signature)
  attestations: write
  actions: read        # SignPath reads the unsigned artifact and the build's origin

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/LauncherSelfTests -c Release

  publish:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The patch data is not in the repository. Publish-Release.ps1 puts it on the "patch-data" release before it tags.
      - name: Get patch data
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download patch-data --repo "$GITHUB_REPOSITORY" --dir patch-data --pattern 'multipatch.jcpatch*'
          expected="$(tr -d '[:space:]' < patch-data/multipatch.jcpatch.sha256 | tr '[:upper:]' '[:lower:]')"
          actual="$(if command -v sha256sum > /dev/null; then sha256sum patch-data/multipatch.jcpatch; else shasum -a 256 patch-data/multipatch.jcpatch; fi | cut -d' ' -f1)"
          [ "$actual" = "$expected" ] || { echo "multipatch.jcpatch failed its SHA-256 check."; exit 1; }
      - name: Publish
        shell: bash
        env:
          JacintoSentryDsn: ${{ secrets.SENTRY_DSN }}
          JacintoAptabaseKey: ${{ secrets.APTABASE_APP_KEY }}
          JacintoEmbedPatch: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: dotnet publish GoW3Jacinto_Launcher.csproj -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}
      - name: Upload for signing
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
      # Windows Authenticode signing through SignPath Foundation (free for open source).
      # Runs once the SIGNPATH_ORGANIZATION_ID variable and SIGNPATH_API_TOKEN secret exist; see DEVELOPMENT.md.
      - name: Sign
        if: matrix.rid == 'win-x64' && startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: GOW3_Jacinto_Launcher
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use signed files
        if: matrix.rid == 'win-x64' && startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: rm -rf publish/win-x64 && mv signed publish/win-x64
      - name: Attest provenance
        if: startsWith(github.ref, 'refs/tags/') && !startsWith(matrix.rid, 'osx')
        continue-on-error: true   # Sigstore sometimes fails ("error creating signing certificate"); provenance is extra, it must not stop a release
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: publish/${{ matrix.rid }}/GoW3Jacinto_*
      # The macOS builds are finished (signed, put in one .app and .dmg) by the macos-package job below.
      - if: ${{ !startsWith(matrix.rid, 'osx') }}
        uses: actions/upload-artifact@v4
        with:
          name: GoW3Jacinto_Launcher-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

  # One macOS download for Apple Silicon and Intel: a .app with both builds inside, in a .dmg, signed, notarized and stapled.
  # Needs these secrets (DEVELOPMENT.md): MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID.
  # Without them the app is signed ad hoc and the log says so. The signed single builds go on as the updater's zips.
  macos-package:
    needs: publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-osx-arm64
          path: mac/osx-arm64
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-osx-x64
          path: mac/osx-x64
      - name: Build, sign and notarize the app and disk image
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x mac/*/GoW3Jacinto_Launcher   # Artifacts lose the executable bit.
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' GoW3Jacinto_Launcher.csproj | head -1)"
          bash tools/Package-macOS.sh mac/osx-arm64 mac/osx-x64 dist-mac "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: GoW3Jacinto_Launcher-osx-arm64
          path: mac/osx-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: GoW3Jacinto_Launcher-osx-x64
          path: mac/osx-x64
      - uses: actions/upload-artifact@v4
        with:
          name: GoW3Jacinto_Launcher-macos-dmg
          path: dist-mac/*.dmg

  # The same names as dist/. The launcher's update check reads them and SHA256SUMS.txt; see LauncherUpdate.cs.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish, macos-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: GoW3Jacinto_Launcher-*
      - name: Zip and checksum
        run: |
          for dir in GoW3Jacinto_Launcher-*/; do
            rid="${dir%/}"
            case "${rid#GoW3Jacinto_Launcher-}" in
              win-x64) platform=Windows_x64 ;;
              linux-x64) platform=Linux_x64 ;;
              osx-arm64) platform=macOS_arm64 ;;
              osx-x64) platform=macOS_x64 ;;
              macos-dmg) cp "$dir"/*.dmg "Gears3_Multipatch_Launcher_${GITHUB_REF_NAME}_macOS.dmg"; continue ;;
            esac
            mkdir -p "package/$platform"
            cp -r "$rid" "package/$platform/Gears3_Multipatch_Launcher"
            # Artifacts lose the executable bit.
            [ "$platform" = Windows_x64 ] || chmod +x "package/$platform"/Gears3_Multipatch_Launcher/GoW3Jacinto_*
            cp packaging/INSTALL_TUTORIAL.txt changelog.txt languages.csv LICENSE "package/$platform/Gears3_Multipatch_Launcher/"
            (cd "package/$platform" && zip -qr "../../Gears3_Multipatch_Launcher_${GITHUB_REF_NAME}_$platform.zip" .)
          done
          sha256sum Gears3_Multipatch_Launcher_*.zip Gears3_Multipatch_Launcher_*.dmg > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # The draft is made first and the files go up separately, each tried three times: an upload right after the
        # draft is created can get a 404 while GitHub is still settling it. A rerun reuses the draft.
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes
          for file in Gears3_Multipatch_Launcher_*.zip Gears3_Multipatch_Launcher_*.dmg SHA256SUMS.txt; do
            for try in 1 2 3; do
              gh release upload "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY" --clobber && break
              [ "$try" = 3 ] && exit 1
              echo "Upload of $file failed (try $try of 3), retrying in $((15 * try)) s..."; sleep $((15 * try))
            done
          done
